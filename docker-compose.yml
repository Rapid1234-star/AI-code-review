services:
  postgres:
    image: postgres:16-alpine
    container_name: strix-postgres
    environment:
      POSTGRES_USER: strix
      POSTGRES_PASSWORD: strix
      POSTGRES_DB: strix
    ports:
      - "5432:5432"
    volumes:
      - strix_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strix -d strix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  strix_pg:
